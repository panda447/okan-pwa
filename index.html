<script>
// 明るい/暗いは描く前に決める（読み込み中に色がちらつかないように）。本体は js/theme.js
(function () {
  var pref = 'auto';
  try { pref = (JSON.parse(localStorage.getItem('okan-pwa-db-v1') || '{}').settings || {}).theme || 'auto'; } catch (e) { /* 既定のまま */ }
  var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
})();
</script>
